<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabScroll</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="overlay.css">
  </head>
  <body data-theme="night" tabindex="-1">
    <div id="ts-scene-fallback" class="ts-scene-fallback" aria-hidden="true">
      <span class="ts-fallback-tab ts-fallback-tab--1"></span>
      <span class="ts-fallback-tab ts-fallback-tab--2"></span>
      <span class="ts-fallback-tab ts-fallback-tab--3"></span>
      <span class="ts-fallback-tab ts-fallback-tab--4"></span>
      <span class="ts-fallback-tab ts-fallback-tab--5"></span>
      <span class="ts-fallback-tab ts-fallback-tab--6"></span>
    </div>
    <canvas id="ts-scene" aria-hidden="true"></canvas>
    <div id="app"></div>
    <script src="overlay.js"></script>
    <script type="module" src="tab-scene.js"></script>
  </body>
</html>
