<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabScroll language picker states</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="../overlay.css">
    <style>
      /* Hallmark · component preview: language menu · all eight states */
      body {
        min-height: 100dvh;
        overflow-y: auto;
        padding: var(--space-lg);
      }

      .preview {
        display: grid;
        width: min(52rem, 100%);
        margin-inline: auto;
        gap: var(--space-lg);
      }

      .preview h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--text-xl);
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: var(--space-sm);
      }

      .preview-state {
        display: grid;
        min-width: 0;
        gap: var(--space-2xs);
      }

      .preview-label {
        color: var(--color-ink-muted);
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        text-transform: uppercase;
      }

      .preview-state .ts-language-trigger {
        width: max-content;
      }

      .preview-menu {
        position: static;
        display: grid;
        width: min(15rem, 100%);
        max-height: none;
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body data-theme="white">
    <main class="preview">
      <h1>Language picker — eight states</h1>
      <div class="preview-grid" id="states"></div>
      <div class="ts-language-menu preview-menu" role="menu" aria-label="Language">
        <div class="ts-language-menu-title">Language</div>
        <button class="ts-language-option is-selected" type="button" role="menuitemradio" aria-checked="true">
          <img class="ts-language-flag" src="../icons/flags/gb.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>English</strong><span>EN</span></span>
          <span class="ts-language-check" aria-hidden="true">✓</span>
        </button>
        <button class="ts-language-option" type="button" role="menuitemradio" aria-checked="false">
          <img class="ts-language-flag" src="../icons/flags/br.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>Português (Brasil)</strong><span>PT</span></span>
          <span class="ts-language-check" aria-hidden="true"></span>
        </button>
        <button class="ts-language-option" type="button" role="menuitemradio" aria-checked="false">
          <img class="ts-language-flag" src="../icons/flags/es.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>Español</strong><span>ES</span></span>
          <span class="ts-language-check" aria-hidden="true"></span>
        </button>
        <button class="ts-language-option" type="button" role="menuitemradio" aria-checked="false">
          <img class="ts-language-flag" src="../icons/flags/fr.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>Français</strong><span>FR</span></span>
          <span class="ts-language-check" aria-hidden="true"></span>
        </button>
        <button class="ts-language-option" type="button" role="menuitemradio" aria-checked="false">
          <img class="ts-language-flag" src="../icons/flags/de.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>Deutsch</strong><span>DE</span></span>
          <span class="ts-language-check" aria-hidden="true"></span>
        </button>
        <button class="ts-language-option" type="button" role="menuitemradio" aria-checked="false">
          <img class="ts-language-flag" src="../icons/flags/tr.svg" alt="" aria-hidden="true">
          <span class="ts-language-option-copy"><strong>Türkçe</strong><span>TR</span></span>
          <span class="ts-language-check" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <script>
      const states = [
        ["default", ""],
        ["hover", "is-hover"],
        ["focus", "is-focus"],
        ["active", "is-active"],
        ["disabled", "is-disabled"],
        ["loading", "is-loading"],
        ["error", "is-error"],
        ["success", "is-success"],
      ];

      document.getElementById("states").innerHTML = states
        .map(([label, className]) => {
          const icon =
            label === "loading"
              ? '<span class="ts-language-spinner" aria-hidden="true"></span>'
              : label === "error"
              ? '<span class="ts-language-feedback ts-language-feedback--error" aria-hidden="true">!</span>'
              : label === "success"
              ? '<span class="ts-language-feedback ts-language-feedback--success" aria-hidden="true">✓</span>'
              : '<span class="ts-language-chevron" aria-hidden="true">▾</span>';
          return [
            '<div class="preview-state">',
            `  <span class="preview-label">${label}</span>`,
            `  <button class="ts-language-trigger ${className}" type="button"${label === "disabled" ? ' disabled aria-disabled="true"' : ""}>`,
            '    <img class="ts-language-flag" src="../icons/flags/br.svg" alt="" aria-hidden="true">',
            '    <span class="ts-language-active-name">Português (Brasil)</span>',
            '    <span class="ts-language-code" aria-hidden="true">PT</span>',
            `    <span class="ts-language-status-icon">${icon}</span>`,
            "  </button>",
            "</div>",
          ].join("");
        })
        .join("");
    </script>
  </body>
</html>
