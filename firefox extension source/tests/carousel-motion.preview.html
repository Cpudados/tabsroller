<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabScroll carousel motion preview</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="../overlay.css">
  </head>
  <body data-theme="white" tabindex="-1">
    <div id="app"></div>
    <script>
      const preview = (label, paper, ink, signal) => {
        const svg = [
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">',
          `<rect width="1280" height="720" fill="${paper}"/>`,
          `<path d="M0 150h1280M0 570h1280M160 0v720M1120 0v720" stroke="${ink}" stroke-opacity=".18"/>`,
          `<circle cx="1040" cy="180" r="88" fill="none" stroke="${signal}" stroke-width="10"/>`,
          `<rect x="160" y="190" width="610" height="26" rx="13" fill="${ink}" fill-opacity=".82"/>`,
          `<rect x="160" y="250" width="420" height="16" rx="8" fill="${ink}" fill-opacity=".28"/>`,
          `<rect x="160" y="360" width="960" height="150" rx="18" fill="${ink}" fill-opacity=".08"/>`,
          `<text x="160" y="650" fill="${ink}" font-family="system-ui,sans-serif" font-size="42" font-weight="700">${label}</text>`,
          '</svg>',
        ].join("");
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      };

      const tabs = [
        {
          id: 1,
          windowId: 7,
          index: 0,
          title: "Release board",
          url: "https://release.example/board",
          active: true,
          lastAccessed: Date.now(),
          preview: preview("RELEASE BOARD", "#ebe5d7", "#261f19", "#d53a24"),
          kind: "regular-tab",
          windowLabel: "Current Window",
        },
        {
          id: 2,
          windowId: 7,
          index: 1,
          title: "API reference",
          url: "https://docs.example/reference",
          active: false,
          lastAccessed: Date.now() - 60000,
          preview: preview("API REFERENCE", "#dce6ea", "#17262d", "#286f91"),
          kind: "regular-tab",
          windowLabel: "Current Window",
        },
        {
          id: 3,
          windowId: 7,
          index: 2,
          title: "Incident notes",
          url: "https://ops.example/incidents/42",
          active: false,
          lastAccessed: Date.now() - 120000,
          preview: preview("INCIDENT NOTES", "#e8dedb", "#2a1e1d", "#a7362b"),
          kind: "regular-tab",
          windowLabel: "Current Window",
        },
        {
          id: 4,
          windowId: 7,
          index: 3,
          title: "Design review",
          url: "https://studio.example/review",
          active: false,
          lastAccessed: Date.now() - 180000,
          preview: preview("DESIGN REVIEW", "#e2e0d2", "#24271c", "#788322"),
          kind: "regular-tab",
          windowLabel: "Current Window",
        },
        {
          id: 5,
          windowId: 7,
          index: 4,
          title: "Performance trace",
          url: "https://trace.example/session",
          active: false,
          lastAccessed: Date.now() - 240000,
          preview: preview("PERFORMANCE TRACE", "#dcdce4", "#20202c", "#5d57a3"),
          kind: "regular-tab",
          windowLabel: "Current Window",
        },
      ];

      globalThis.browser = {
        runtime: {
          id: "tabscroll-preview",
          getURL(value) {
            return new URL(`../${value}`, window.location.href).href;
          },
          async sendMessage(message) {
            if (message.type === "tabscroll:get-session") {
              return {
                ok: true,
                payload: {
                  activeIndex: 0,
                  currentWindowId: 7,
                  recentTabId: 2,
                  tabs,
                },
              };
            }

            return { ok: true };
          },
        },
      };
    </script>
    <script src="../overlay.js"></script>
  </body>
</html>
